version: '3'
services:
  postgres:
    image: "postgres:14"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d root"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: curso-ci-3:local
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - DATABASE_NAME=root
      - DATABASE_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin-compose:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "gui@alura.com"
      PGADMIN_DEFAULT_PASSWORD: "123456"
    ports:
      - "54321:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
