name: Load Test

on:
  workflow_call:

concurrency:
  group: infra-homolog-loadtest
  cancel-in-progress: false

jobs:

  loadtest:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://${{ secrets.REMOTE_HOST }}:8083
    steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Locust
      run: pip install "locust==2.32.4"

    - name: Create locustfile
      run: |
        cat > locustfile.py << 'EOF'
        from locust import HttpUser, TaskSet, task, between

        class UserTasks(TaskSet):
            @task(1)
            def index(self):
                self.client.get("/nicolas")

        class WebsiteUser(HttpUser):
            tasks = [UserTasks]
            wait_time = between(1, 5)
        EOF

    - name: Run Load Test
      run: |
        for i in $(seq 1 30); do
          if curl -fsS "$APP_URL/nicolas"; then
            echo "Aplicacao respondeu"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "Aplicacao nao respondeu a tempo em $APP_URL/nicolas"
            exit 1
          fi
          sleep 10
        done
        locust -f locustfile.py --headless -u 10 -r 5 --run-time 60s -H "$APP_URL"
