name: Load Test

on:
  workflow_call:

concurrency:
  group: infra-homolog-loadtest
  cancel-in-progress: false

jobs:

  loadtest:
    runs-on: ubuntu-latest
    env:
      TF_VAR_imagem: ${{ secrets.DOCKERHUB_USERNAME }}/curso-ci-3:${{ github.sha }}
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Clone infrastructure
      run: git clone --depth 1 https://github.com/nicolasandreos/Infra_CI.git

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2.0.3
      with:
        terraform_version: 1.10.5
        terraform_wrapper: false

    - name: Prepare Terraform state bucket
      run: |
        ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
        BUCKET="tf-state-${ACCOUNT_ID}-curso-ci"
        if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
          aws s3api create-bucket \
            --bucket "$BUCKET" \
            --region us-west-2 \
            --create-bucket-configuration LocationConstraint=us-west-2
        fi
        aws s3api put-bucket-versioning \
          --bucket "$BUCKET" \
          --versioning-configuration Status=Enabled
        aws s3api put-public-access-block \
          --bucket "$BUCKET" \
          --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
        aws s3api put-bucket-encryption \
          --bucket "$BUCKET" \
          --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
        echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

    - name: Terraform init
      run: |
        terraform -chdir=Infra_CI/env/Homolog init -input=false -reconfigure \
          -backend-config="bucket=${TF_STATE_BUCKET}"

    - name: Terraform destroy previous
      run: terraform -chdir=Infra_CI/env/Homolog destroy -auto-approve -input=false -lock-timeout=5m

    - name: Terraform apply
      run: terraform -chdir=Infra_CI/env/Homolog apply -auto-approve -input=false -lock-timeout=5m

    - name: Read ALB address
      id: URL
      run: echo "url=$(terraform -chdir=Infra_CI/env/Homolog output -raw IP_alb)" >> "$GITHUB_OUTPUT"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Locust
      run: pip install "locust==2.32.4"

    - name: Create locustfile
      run: |
        cat > locustfile.py << 'EOF'
        from locust import HttpUser, TaskSet, task, between

        class UserTasks(TaskSet):
            @task(1)
            def index(self):
                self.client.get("/nicolas")

        class WebsiteUser(HttpUser):
            tasks = [UserTasks]
            wait_time = between(1, 5)
        EOF

    - name: Run Load Test
      run: |
        URL="http://${{ steps.URL.outputs.url }}"
        for i in $(seq 1 30); do
          if curl -fsS "$URL/nicolas"; then
            echo "Aplicacao respondeu"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "Aplicacao nao respondeu a tempo em $URL/nicolas"
            exit 1
          fi
          sleep 10
        done
        locust -f locustfile.py --headless -u 10 -r 5 --run-time 60s -H "$URL"

    - name: Terraform destroy
      if: always()
      run: terraform -chdir=Infra_CI/env/Homolog destroy -auto-approve -input=false -lock-timeout=5m
