name: Deploy to EC2 Instance in AWS

on:
  workflow_call:

jobs:

  deploy_ec2:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v3

      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: programa

      - name: Make binary executable
        run: chmod +x main && ls -la main

      - name: Setup SSH Deploy
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/${{ secrets.REMOTE_USER }}
          EXCLUDE: "postgres-data"

      - name: Execute remote ssh commands using password
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY}}
          port: 22
          debug: true
          script: |
            cd /home/${{ secrets.REMOTE_USER }}
            echo "=== workspace ==="
            ls -la
            if [ ! -f main ]; then
              echo "ERROR: binary main not found"
              exit 1
            fi
            pkill -x main || true
            export DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            export DATABASE_USER=${{ secrets.DATABASE_USER }}
            export DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            export DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            export DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            export DATABASE_SSLMODE=require
            export PORT=8083
            chmod +x main
            setsid ./main > nohup.out 2> nohup.err < /dev/null &
            sleep 3
            echo "=== nohup.out ==="
            cat nohup.out || true
            echo "=== nohup.err ==="
            cat nohup.err || true
            if ! pgrep -x main >/dev/null; then
              echo "ERROR: process main is not running"
              exit 1
            fi
            echo "main is running"
